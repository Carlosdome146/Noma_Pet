<head>

<link href="assets/orders.css" rel="stylesheet"/>

<body>
<div class="topbar" hidden="" id="checkoutTopbar"></div>
<nav class="nav">
<div class="container navin">
<a class="brand" href="index.html"><span class="brandmark">N</span>NÓMA PET</a>
<div class="links">
<a href="tienda.html">Tienda</a>
<a href="carrito.html">Carrito</a>
</div>
<div class="actions"><a class="btn secondary" href="carrito.html">← Volver</a></div>
</div>
</nav>
<main>
<section class="pagehead">
<div class="container">
<span class="eyebrow">Checkout</span>
<h1>Datos de envío.</h1>
<p class="lead">Revisa tus datos, los plazos de cada artículo y el total antes de continuar al pago seguro de Stripe.</p>
<div class="notice order-test-notice" hidden="" id="testModeNotice"></div>
<div class="checkout-grid">
<form class="checkout-card" id="checkoutForm">
<h2>Contacto y entrega</h2>
<div class="formgrid">
<label class="field full">Nombre y apellidos *
                <input autocomplete="name" id="customerName" maxlength="180" required=""/>
</label>
<label class="field">Email *
                <input autocomplete="email" id="customerEmail" maxlength="254" required="" type="email"/>
</label>
<label class="field">Teléfono *
                <input autocomplete="tel" id="customerPhone" maxlength="60" type="tel" required=""/>
</label>
<label class="field full">Dirección *
                <input autocomplete="address-line1" id="addressLine1" maxlength="240" required=""/>
</label>
<label class="field full">Piso, puerta, etc.
                <input autocomplete="address-line2" id="addressLine2" maxlength="240"/>
</label>
<label class="field">Código postal *
                <input autocomplete="postal-code" id="postalCode" maxlength="30" required=""/>
</label>
<label class="field">Localidad *
                <input autocomplete="address-level2" id="city" maxlength="120" required=""/>
</label>
<label class="field">Provincia
                <input autocomplete="address-level1" id="province" maxlength="120"/>
</label>
<label class="field">País
                <select id="country"><option value="ES">España</option></select>
</label>
<label class="field full">Notas para el pedido
                <textarea id="orderNotes" maxlength="1000" placeholder="Opcional" rows="3"></textarea>
</label>
</div>
<label class="checkout-consent">
<input id="acceptTerms" required="" type="checkbox"/>
<span>He leído y acepto las <a href="condiciones.html" target="_blank">Condiciones de compra</a>, la <a href="privacidad.html" target="_blank">Política de privacidad</a> y la información sobre <a href="devoluciones.html" target="_blank">devoluciones y desistimiento</a>. Entiendo que confirmar el pedido implica una obligación de pago.</span>
</label>
<div class="form-error" hidden="" id="checkoutError"></div>
<button class="btn primary checkout-submit" disabled="" id="checkoutSubmit" type="submit">Comprobando pago…</button>
<p class="tiny" id="checkoutHelp">El pago se procesa de forma segura mediante Stripe.</p>
</form>
<aside class="summary checkout-summary">
<h3>Tu pedido</h3>
<div id="checkoutItems"></div>
<div id="checkoutTotals"></div>
</aside>
</div>
</div>
</section>
</main>
<script src="assets/checkout.js"></script>
</body>
</html>
